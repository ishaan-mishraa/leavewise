# Render blueprint for the Spring Boot API. In Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: leavewise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
        sync: false
      - key: DATABASE_USERNAME   # postgres.<your-project-ref>
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS        # https://your-app.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
