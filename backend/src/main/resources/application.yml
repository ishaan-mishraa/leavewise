spring:
  application:
    name: leavewise-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leavewise}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
  jwt-expiry-hours: 12
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  demo-login: ${DEMO_LOGIN:true}
  demo-password: ${DEMO_PASSWORD:leavewise123}
  seed-demo-data: ${SEED_DEMO_DATA:true}
